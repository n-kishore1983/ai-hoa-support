spring:
  application:
    name: ai-hoa-support
  ai:
    model:
      chat: ${app.embedding.llm}
      embedding: ${app.embedding.llm}
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        initialize-schema: true
        collection-name: hoa-documents
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        model: ${app.embedding.openai.model-name:text-embedding-3-small}
    ollama:
      base-url: ${app.embedding.ollama.base-url:http://localhost:11434}
      embedding:
        model: ${app.embedding.ollama.model-name:mxbai-embed-large}
      init:
        pull-model-strategy: always
    mcp:
      server:
        protocol: sse
        name: ai-hoa-support
        version: 0.0.1
        enabled: true
        type: sync
        streamable-http:
          mcp-endpoint: /mcp

app:
  chat:
    model: ${app.chat.model-name:}
  embedding:
    llm: openai
    ollama:
      base-url: http://localhost:11434
      model-name: mxbai-embed-large
    openai:
      api-key: ${OPENAI_API_KEY:}
      model-name: text-embedding-3-large

hoa:
  document-folder-path: ${HOA_DOCUMENT_FOLDER_PATH:}
  document-loading-enabled: ${HOA_DOCUMENT_LOADING_ENABLED:false}
  ocr-enabled: ${HOA_OCR_ENABLED:true}
  ocr-language: ${HOA_OCR_LANGUAGE:eng}
  ocr-tesseract-path: ${HOA_OCR_TESSERACT_PATH:}
  ocr-tessdata-path: ${HOA_OCR_TESSDATA_PATH:}
server:
  port: 8083
